<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Switch · Console</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: rgba(18, 25, 34, 0.82);
    --panel-2: rgba(24, 33, 45, 0.72);
    --line: rgba(148, 163, 184, 0.16);
    --line-strong: rgba(148, 163, 184, 0.28);
    --ink: #e6edf3;
    --muted: #8b98a9;
    --dim: #5d6b7c;
    --amber: #ffb454;
    --teal: #5eead4;
    --red: #ff6b6b;
    --green: #7ee787;
    --shadow: 0 18px 60px rgba(0, 0, 0, 0.42);
  }
  [data-theme="light"] {
    --bg: #f7f9fc;
    --panel: rgba(255, 255, 255, 0.7);
    --panel-2: rgba(244, 247, 250, 0.6);
    --line: rgba(148, 163, 184, 0.22);
    --line-strong: rgba(148, 163, 184, 0.35);
    --ink: #0f172a;
    --muted: #64748b;
    --dim: #94a3b8;
    --amber: #d97706;
    --teal: #0f766e;
    --red: #dc2626;
    --green: #15803d;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(900px 500px at 12% -8%, rgba(255, 180, 84, 0.13), transparent 62%),
      radial-gradient(760px 440px at 92% 0%, rgba(94, 234, 212, 0.10), transparent 60%),
      linear-gradient(180deg, #0a0e13 0%, #0b1016 52%, #080b10 100%);
    font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.55;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  [data-theme="light"] body {
    background:
      radial-gradient(900px 500px at 12% -8%, rgba(255, 180, 84, 0.08), transparent 62%),
      radial-gradient(760px 440px at 92% 0%, rgba(94, 234, 212, 0.06), transparent 60%),
      #f7f9fc;
  }
  /* `hidden` must win over component display rules (.toolbar/.active-bar). */
  [hidden] { display: none !important; }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(148, 163, 184, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 163, 184, 0.045) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: linear-gradient(180deg, rgba(0,0,0,0.9), transparent 78%);
  }
  [data-theme="light"] body::before { mask-image: linear-gradient(180deg, rgba(0,0,0,0.5), transparent 78%); }
  .shell { position: relative; width: min(1240px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0 54px; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 26px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .mark {
    width: 46px; height: 46px; border-radius: 13px; flex: 0 0 auto;
    background: linear-gradient(145deg, rgba(255,180,84,0.20), rgba(94,234,212,0.12));
    border: 1px solid rgba(255,180,84,0.35);
    display: grid; place-items: center;
    box-shadow: 0 0 28px rgba(255,180,84,0.12);
  }
  [data-theme="light"] .mark {
    background: linear-gradient(145deg, rgba(217,119,6,0.15), rgba(15,118,110,0.10));
    border-color: rgba(217,119,6,0.35);
    box-shadow: 0 0 28px rgba(217,119,6,0.10);
  }
  .mark svg { width: 28px; height: 28px; }
  h1 { margin: 0; font-size: 24px; letter-spacing: 0.12em; font-weight: 700; }
  .sub { margin-top: 2px; color: var(--muted); font-size: 12.5px; letter-spacing: 0.03em; }
  .head-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line);
    background: rgba(13, 19, 27, 0.72); color: var(--muted);
    font-size: 12px; white-space: nowrap;
  }
  [data-theme="light"] .pill { background: rgba(255,255,255,0.6); border-color: var(--line-strong); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); box-shadow: 0 0 0 0 rgba(126,231,135,0.5); }
  .dot.ok { background: var(--green); animation: pulse 2.2s infinite; }
  .dot.bad { background: var(--red); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(126,231,135,0.38); } 70% { box-shadow: 0 0 0 7px rgba(126,231,135,0); } 100% { box-shadow: 0 0 0 0 rgba(126,231,135,0); } }
  button {
    font: inherit; color: var(--ink); cursor: pointer;
    border: 1px solid var(--line-strong); background: rgba(20, 28, 38, 0.86);
    padding: 7px 12px; border-radius: 8px; transition: border-color .16s ease, transform .16s ease, background .16s ease;
  }
  [data-theme="light"] button { background: rgba(255,255,255,0.7); border-color: var(--line-strong); color: var(--ink); }
  button:hover { border-color: rgba(255,180,84,0.55); background: rgba(28, 37, 49, 0.94); }
  [data-theme="light"] button:hover { background: rgba(255,255,255,0.9); border-color: var(--amber); }
  button:active { transform: translateY(1px); }
  button.ghost { background: transparent; color: var(--muted); }
  button.ghost.ok { color: var(--teal); border-color: rgba(94,234,212,0.34); }
  button.ghost.danger { color: var(--red); border-color: rgba(255,107,107,0.28); }
  button.danger:hover { border-color: rgba(255,107,107,0.6); color: #ffd0d0; }
  .active-bar {
    display: flex; align-items: center; gap: 9px; margin-bottom: 16px; padding: 9px 15px;
    border-radius: 11px; border: 1px solid rgba(94,234,212,0.32);
    background: rgba(94,234,212,0.07); font-size: 13px;
  }
  [data-theme="light"] .active-bar { background: rgba(15,118,110,0.06); border-color: rgba(15,118,110,0.32); }
  .active-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 0 rgba(94,234,212,0.5); animation: pulse 2.2s infinite; }
  .active-provider { color: var(--muted); font-size: 12.5px; }
  .active-model { color: var(--teal); font-size: 14px; font-weight: 600; word-break: break-all; }
  .active-bar .arrow { color: var(--dim); }
  .active-bar .dim { margin-left: auto; font-size: 12px; }
  tr.active td { background: rgba(94,234,212,0.08); }
  tr.active td:first-child { box-shadow: inset 3px 0 0 var(--teal); }
  .tag.live { color: var(--teal); border-color: rgba(94,234,212,0.34); background: rgba(94,234,212,0.08); }
  .tag.pref { color: var(--amber); border-color: rgba(255,180,84,0.34); background: rgba(255,180,84,0.08); }
  .pref-label { display: inline-flex; align-items: center; margin-right: 6px; cursor: pointer; }
  .pref-check { width: 16px; height: 16px; cursor: pointer; accent-color: var(--amber); }
  [data-theme="light"] .pref-check { accent-color: var(--amber); }

  .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); backdrop-filter: blur(12px);
  }
  .stat { padding: 15px 16px; min-height: 86px; }
  .stat .k { color: var(--muted); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; }
  .stat .v { margin-top: 6px; font-size: 28px; line-height: 1.1; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: 13px; color: var(--muted); font-weight: 500; }
  .stat.accent .v { color: var(--amber); }
  .stat.teal .v { color: var(--teal); }
  .stat.red .v { color: var(--red); }
  .panel { overflow: hidden; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .panel-title { font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .panel-title strong { color: var(--ink); font-weight: 650; }
  .panel-body { padding: 14px 16px 16px; }
  .models-body { max-height: 640px; overflow: auto; }

  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type="search"] {
    font: inherit; color: var(--ink); width: 180px;
    border: 1px solid var(--line); background: rgba(8, 12, 17, 0.7);
    border-radius: 8px; padding: 7px 10px; outline: none;
  }
  [data-theme="light"] input[type="search"] { background: rgba(255,255,255,0.8); border-color: var(--line); color: var(--ink); }
  input[type="search"]:focus { border-color: rgba(94,234,212,0.55); }
  select.select, input.select {
    font: inherit; color: var(--ink); cursor: pointer;
    border: 1px solid var(--line); background: rgba(8, 12, 17, 0.7);
    border-radius: 8px; padding: 7px 9px; outline: none;
  }
  input.select { cursor: text; }
  [data-theme="light"] select.select, [data-theme="light"] input.select { background: rgba(255,255,255,0.8); border-color: var(--line); color: var(--ink); }
  select.select:focus, input.select:focus { border-color: rgba(94,234,212,0.55); }
  .tree { display: flex; flex-direction: column; gap: 6px; }
  .prov-name { font-family: "SFMono-Regular", "Cascadia Code", "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; font-weight: 600; color: var(--ink); }
  .model-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); }
  .model-row:hover { border-color: var(--line-strong); }
  .model-row.active { border-color: rgba(94,234,212,0.45); background: rgba(94,234,212,0.08); box-shadow: inset 3px 0 0 var(--teal); }
  .model-row.disabled { opacity: 0.55; }
  .model-row .mr-status { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
  .model-row .mr-model { flex: 1 1 240px; min-width: 0; }
  .model-row .id { font-family: "SFMono-Regular", "Cascadia Code", "IBM Plex Mono", ui-monospace, monospace; font-size: 12.5px; word-break: break-all; }
  .model-row .name { color: var(--dim); font-size: 11.5px; margin-top: 2px; }
  .model-row .mr-last { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); flex: 0 0 auto; white-space: nowrap; }
  .model-row .mr-cool { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; flex: 0 0 auto; white-space: nowrap; }
  .model-row .mr-fail { font-size: 12px; color: var(--muted); flex: 0 0 auto; white-space: nowrap; }
  .model-row .mr-action { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; flex: 0 0 auto; margin-left: auto; }
  .model-row .mr-action .ghost { padding: 3px 8px; font-size: 11px; }
  .cool-time { font-family: "SFMono-Regular", "Cascadia Code", "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .cool-time.over { color: var(--red); }
  .cool-time.warn { color: var(--amber); }

  th { text-align: left; color: var(--dim); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; padding: 0 8px 9px; border-bottom: 1px solid var(--line); }
  td { padding: 10px 8px; border-bottom: 1px solid rgba(148,163,184,0.09); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: rgba(148,163,184,0.035); }
  .model { font-family: "SFMono-Regular", "Cascadia Code", "IBM Plex Mono", ui-monospace, monospace; font-size: 12.5px; }
  .model .id { color: var(--ink); word-break: break-all; }
  .model .name { color: var(--dim); font-size: 11.5px; margin-top: 2px; }
  .tag { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 6px; font-size: 11px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .tag.awake { color: var(--green); border-color: rgba(126,231,135,0.28); background: rgba(126,231,135,0.07); }
  .tag.cooling { color: var(--amber); border-color: rgba(255,180,84,0.28); background: rgba(255,180,84,0.07); }
  .tag.err { color: var(--red); border-color: rgba(255,107,107,0.28); background: rgba(255,107,107,0.07); }
  .tag.blocked { color: var(--dim); border-color: rgba(148,163,184,0.30); background: rgba(148,163,184,0.08); text-decoration: line-through; }
  .tag.free { color: var(--teal); border-color: rgba(94,234,212,0.34); background: rgba(94,234,212,0.08); }
  .tag.paid { color: var(--amber); border-color: rgba(255,180,84,0.34); background: rgba(255,180,84,0.08); }
  .muted { color: var(--muted); }
  .dim { color: var(--dim); }
  .mono { font-family: "SFMono-Regular", "Cascadia Code", "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .arrow { color: var(--dim); }
  .empty { padding: 26px 8px; text-align: center; color: var(--dim); }
  .banner { display: none; margin-bottom: 14px; padding: 10px 14px; border-radius: 9px; border: 1px solid rgba(255,107,107,0.35); background: rgba(255,107,107,0.08); color: #ffd0d0; font-size: 12.5px; }
  [data-theme="light"] .banner { background: rgba(220,38,38,0.08); border-color: rgba(220,38,38,0.35); color: #dc2626; }
  footer { margin-top: 18px; display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; color: var(--dim); font-size: 11.5px; }
  footer code { color: var(--muted); }
  @media (max-width: 920px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid2 { grid-template-columns: 1fr; }
    .splitter { display: none; }
  }
  @media (max-width: 560px) {
    .shell { width: calc(100% - 24px); padding-top: 20px; }
    header { flex-direction: column; }
    .stats { grid-template-columns: 1fr 1fr; }
    .stat .v { font-size: 23px; }
    input[type="search"] { width: 100%; }
  }

  /* ---- 供应商 / 模型 双栏 + 可拖拽分隔 ---- */
  .grid2 { display: grid; grid-template-columns: var(--prov-w, 34%) 8px 1fr; align-items: stretch; min-height: 540px; }
  .pane { display: flex; flex-direction: column; min-width: 0; }
  .pane-providers { min-width: 0; }
  .pane-models { min-width: 0; }
  .splitter { width: 8px; cursor: col-resize; background: linear-gradient(var(--line), var(--line)); border-radius: 4px; align-self: stretch; transition: background .15s ease; }
  .splitter:hover, .splitter.dragging { background: var(--amber); }
  .pane-scroll, .models-body { max-height: 560px; overflow-y: auto; }
  .prov-list { display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
  .prov-item {
    display: flex; flex-direction: column; gap: 7px;
    padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2);
    cursor: pointer; transition: border-color .15s ease, background .15s ease;
  }
  .prov-item:hover { border-color: var(--line-strong); }
  .prov-item.selected { border-color: rgba(94,234,212,0.60); background: rgba(94,234,212,0.16); box-shadow: inset 3px 0 0 rgba(94,234,212,0.60); }
  .prov-item.has-credits { border-color: rgba(94,234,212,0.30); }
  .prov-item .prov-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 9px; min-width: 0; }
  .prov-item .prov-ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 14px; background: rgba(148,163,184,0.10); border: 1px solid var(--line); flex: 0 0 auto; }
  .prov-item.has-credits .prov-ic { background: rgba(94,234,212,0.12); border-color: rgba(94,234,212,0.30); }
  .prov-item .prov-name { font-family: "SFMono-Regular", "Cascadia Code", "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; font-weight: 600; color: var(--ink); word-break: break-all; flex: 0 1 auto; min-width: 0; }
  .prov-item.has-credits .prov-name { color: var(--teal); }
  .prov-item .prov-actions { display: flex; gap: 6px; flex: 0 0 auto; margin-left: auto; }
  .prov-item .prov-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 11.5px; color: var(--muted); min-width: 0; }
  .prov-item .prov-stat { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .prov-item .prov-sub .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: 0 0 auto; }
  .prov-item.healthy .prov-sub .dot { background: var(--green); }
  .prov-item.degraded .prov-sub .dot { background: var(--amber); }
  .prov-item.down .prov-sub .dot { background: var(--red); }
  .prov-item .prov-credit { white-space: nowrap; font-size: 11px; color: var(--dim); }
  .prov-item .prov-credit b { color: var(--teal); font-weight: 600; }
  .prov-item .prov-actions { display: flex; gap: 6px; }

  /* ---- 选择提供商 dialog ---- */
  #prov-dialog { border: 1px solid var(--line-strong); border-radius: 12px; padding: 0; max-width: 520px; width: calc(100vw - 48px); max-height: min(72vh, 560px); box-shadow: 0 18px 60px rgba(0,0,0,0.35); color: var(--ink); background: var(--panel); }
  #prov-dialog::backdrop { background: rgba(2,6,23,0.55); backdrop-filter: blur(2px); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .dlg-body { padding: 12px 16px 16px; overflow-y: auto; max-height: calc(min(72vh, 560px) - 58px); }
  .dlg-list { display: flex; flex-direction: column; gap: 6px; }
  .dlg-item { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); transition: border-color .15s ease, background .15s ease; }
  .dlg-item:hover { border-color: var(--line-strong); }
  .dlg-item.selected { border-color: rgba(94,234,212,0.60); background: rgba(94,234,212,0.16); box-shadow: inset 3px 0 0 rgba(94,234,212,0.60); }
  .dlg-item .prov-chip-check { width: 16px; height: 16px; cursor: pointer; accent-color: var(--teal); flex: 0 0 auto; }
  .dlg-item .chip-ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; background: rgba(148,163,184,0.10); border: 1px solid var(--line); flex: 0 0 auto; }
  .dlg-item.selected .chip-ic { background: rgba(94,234,212,0.15); border-color: rgba(94,234,212,0.35); }
  .dlg-item .chip-name { font-family: "SFMono-Regular", "Cascadia Code", "IBM Plex Mono", ui-monospace, monospace; font-size: 12.5px; font-weight: 600; word-break: break-all; flex: 1; min-width: 0; }
  .dlg-item .chip-credit { color: var(--muted); font-size: 11px; }
  .dlg-item .chip-credit b { color: var(--teal); font-weight: 600; }
  .dlg-item .chip-credit-wrap { display: flex; gap: 8px; align-items: center; margin-left: auto; flex: 0 0 auto; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M6 11h17l-4-4" stroke="#ffb454" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M26 21H9l4 4" stroke="#5eead4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16" cy="16" r="2" fill="#e6edf3"/>
        </svg>
      </div>
      <div>
        <h1>FREE / SWITCH</h1>
        <div class="sub">Magpie 免费模型自动切换 · 冷却与调用追踪</div>
      </div>
    </div>
    <div class="head-right">
      <span class="pill"><span id="health-dot" class="dot"></span><span id="health-text">连接中</span></span>
      <button id="theme-toggle" class="ghost" type="button" title="切换主题">🌓</button>
      <button id="prov-picker-btn" class="ghost" type="button" title="选择哪些供应商参与免费模型自动切换">选择提供商</button>
      <button id="refresh" class="ghost" type="button">刷新模型</button>
      <button id="clear" class="ghost danger" type="button">清空冷却</button>
    </div>
  </header>

  <div id="banner" class="banner"></div>

  <div id="active-bar" class="active-bar" hidden>
    <span class="active-dot"></span>
    <span class="muted">当前活跃</span>
    <span class="active-provider mono" id="active-provider"></span>
    <span class="arrow">/</span>
    <span class="active-model mono" id="active-model"></span>
    <span class="dim" id="active-at"></span>
  </div>

  <section class="stats">
    <div class="card stat accent"><div class="k">Requests</div><div class="v" id="s-requests">0</div></div>
    <div class="card stat teal"><div class="k">Switches</div><div class="v" id="s-switches">0</div></div>
    <div class="card stat"><div class="k">Success</div><div class="v" id="s-success">0 <small id="s-rate"></small></div></div>
    <div class="card stat red"><div class="k">Exhausted</div><div class="v" id="s-exhausted">0</div></div>
    <div class="card stat"><div class="k">Cooling</div><div class="v" id="s-cooling">0 <small id="s-awake"></small></div></div>
  </section>

  <div class="grid2" id="grid2">
    <section class="card panel pane pane-providers">
      <div class="panel-head">
        <div class="panel-title"><strong>已选提供商</strong> <span id="sel-count" class="dim"></span></div>
      </div>
      <div class="panel-body pane-scroll">
        <div id="sel-prov-list" class="prov-list"></div>
        <div id="sel-prov-empty" class="empty" hidden>暂无已选提供商。在上面勾选后这里会显示它们的状态。</div>
      </div>
    </section>
    <div class="splitter" id="splitter" title="拖拽调整左右宽度"></div>
    <section class="card panel pane pane-models">
      <div class="panel-head">
        <div class="panel-title"><strong>模型</strong> <span id="model-count" class="dim"></span></div>
        <div class="toolbar">
          <select id="sort" class="select" title="排序方式">
            <option value="priority">优先级</option>
            <option value="wake">苏醒时间</option>
            <option value="name">按名称</option>
            <option value="cooling">冷却优先</option>
          </select>
          <select id="strategy" class="select" title="自动切换策略：完全免费 / 先付费后免费 / 先免费后付费">
            <option value="free">完全免费</option>
            <option value="paid-first">先付费后免费</option>
            <option value="free-first">先免费后付费</option>
          </select>
          <span id="paid-policy" class="toolbar" hidden>
            <input id="paid-window" class="select" type="text" size="11" placeholder="22:00-06:00" title="自动使用付费模型的时间窗口（本地时间），留空表示全天；支持跨午夜">
            <input id="paid-min-balance" class="select" type="number" min="0" step="1" size="6" placeholder="余额下限" title="供应商余额低于该值时不再自动使用其付费模型；留空或 0 表示不限制">
          </span>
          <input id="filter" type="search" placeholder="过滤模型 / 供应商" autocomplete="off">
        </div>
      </div>
      <div class="panel-body models-body">
        <div id="models" class="tree"></div>
        <div id="models-empty" class="empty" hidden>还没有发现免费模型。点“刷新模型”，或检查 Magpie 里已启用的供应商。</div>
      </div>
    </section>
  </div>

  <dialog id="prov-dialog">
    <div class="dlg-head">
      <div class="panel-title"><strong>选择提供商</strong> <span id="prov-count" class="dim"></span></div>
      <div class="toolbar">
        <input id="prov-search" type="search" placeholder="过滤提供商" autocomplete="off">
        <button id="prov-dialog-close" class="ghost" type="button">关闭</button>
      </div>
    </div>
    <div class="dlg-body">
      <div id="dlg-prov-list" class="dlg-list"></div>
      <div id="dlg-prov-empty" class="empty" hidden>没有匹配的提供商。</div>
    </div>
  </dialog>

  <footer>
    <div>Gateway <code id="gateway">—</code></div>
    <div>版本 <code id="version">—</code></div>
    <div>配置 <code id="config-path">—</code></div>
    <div>只监听 127.0.0.1 · 每 2 秒自动刷新</div>
  </footer>
</div>
<script>
(function () {
  "use strict";
  var state = null;
  var filter = "";
  var provSearch = "";
  var provFocus = "";
  var loading = false;
  var sortMode = "priority";

  // ---- 主题：跟随系统，手动可覆盖 ----
  var THEME_KEY = "free-switch-theme";
  var themeMode = "system"; // system | light | dark
  var stored = null;
  try { stored = localStorage.getItem(THEME_KEY); } catch { /* storage may be blocked */ }
  if (stored === "light" || stored === "dark" || stored === "system") themeMode = stored;
  function applyTheme() {
    var root = document.documentElement;
    var resolved;
    if (themeMode === "system") {
      resolved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    } else {
      resolved = themeMode;
    }
    root.setAttribute("data-theme", resolved);
    var btn = document.getElementById("theme-toggle");
    if (btn) {
      btn.title = "当前：" + (resolved === "dark" ? "深色" : "浅色") + "（" + (themeMode === "system" ? "跟随系统" : themeMode) + "）";
    }
  }
  function saveTheme() {
    try { localStorage.setItem(THEME_KEY, themeMode); } catch { /* ignore */ }
  }
  applyTheme();
  try {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
      if (themeMode === "system") applyTheme();
    });
  } catch { /* older browsers */ }

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  function n(value) {
    return Number(value || 0).toLocaleString("zh-CN");
  }
  function clock(ts) {
    if (!ts) return "—";
    var d = new Date(ts);
    return d.toLocaleTimeString("zh-CN", { hour12: false });
  }
  function until(ts) {
    if (!ts) return "";
    var left = Number(ts) - Date.now();
    if (left < 0) return "苏醒";
    var d = Math.floor(left / 86400000);
    var h = Math.floor((left % 86400000) / 3600000);
    var m = Math.floor((left % 3600000) / 60000);
    var parts = [];
    if (d) parts.push(d + "d");
    if (h) parts.push(h + "h");
    if (m) parts.push(m + "m");
    if (!parts.length) return "刚苏醒";
    return parts.join(" ");
  }
  function compareModels(a, b, sortMode) {
    var aC = a.cooling ? 1 : 0;
    var bC = b.cooling ? 1 : 0;
    if (sortMode === "cooling") {
      // 冷却优先：冷却模型排前面，按剩余冷却时间升序（越快苏醒越靠前）
      if (aC !== bC) return bC - aC;
    } else {
      // 苏醒时间 / 按名称：冷却模型压到最后，按剩余冷却时间升序（越快苏醒越靠前）
      if (aC !== bC) return aC - bC;
    }
    // 同为冷却：按剩余冷却时间升序
    if (a.cooling && b.cooling) return (a.until || 0) - (b.until || 0);
    // 同为苏醒：按名称或最近成功时间
    if (sortMode === "name") return String(a.id).localeCompare(String(b.id));
    return (b.lastSuccessAt || 0) - (a.lastSuccessAt || 0);
  }
  function modelRow(m, activeId) {
    if (m.paid) {
      var paidName = m.name && m.name !== m.id ? '<div class="name">' + esc(m.name) + "</div>" : "";
      var strategyOn = ((state && state.config && state.config.strategy) || "free") !== "free";
      var paidBlockedTag = !strategyOn ? "" : m.paidBlocked === "window"
        ? '<span class="tag blocked" title="当前不在付费时段内，自动切换不会使用该模型">窗口外</span>'
        : m.paidBlocked === "balance"
        ? '<span class="tag blocked" title="该供应商余额低于设定的下限，自动切换不会使用该模型">余额不足</span>'
        : "";
      var paidNote = !strategyOn
        ? "不参与自动切换"
        : m.paidBlocked === "window"
        ? "不在付费时段"
        : m.paidBlocked === "balance"
        ? "余额低于下限"
        : "可自动使用（受策略限制）";
      return '<div class="model-row paid' + (m.disabled ? " disabled" : "") + '" data-model="' + esc(m.id) + '" title="付费模型：消耗该供应商的积分或余额；自动参与与否由切换策略决定">' +
        '<div class="mr-status"><span class="tag paid">付费</span>' + paidBlockedTag + "</div>" +
        '<div class="mr-model"><div class="id">' + esc(m.id) + "</div>" + paidName + "</div>" +
        '<div class="mr-fail" title="自动切换是否使用该模型">' + esc(paidNote) + "</div>" +
        '<div class="mr-action"><button class="ghost" data-switch="' + esc(m.id) + '" type="button" title="手动下次请求强制切换到该付费模型（会产生实际费用）">切换付费</button></div>' +
        "</div>";
    }
    var isActive = m.id === activeId;
    var tag = m.disabled
      ? '<span class="tag blocked">已禁用</span>'
      : isActive
      ? '<span class="tag live">使用中</span>'
      : m.cooling
      ? '<span class="tag ' + (m.reason ? "blocked" : "cooling") + '">' + (m.reason ? esc(m.reason) : esc(until(m.until))) + "</span>"
      : '<span class="tag awake">苏醒</span>';
    var last = m.lastStatus
      ? '<span class="tag ' + (m.lastStatus >= 200 && m.lastStatus < 300 ? "awake" : m.lastStatus === 429 ? "cooling" : "err") + '">' + esc(m.lastStatus) + "</span>"
      : '<span class="dim">—</span>';
    var name = m.name && m.name !== m.id ? '<div class="name">' + esc(m.name) + "</div>" : "";
    var err = m.lastError ? '<div class="name" title="' + esc(m.lastError) + '">' + esc(String(m.lastError).slice(0, 90)) + "</div>" : "";
    var preferredTag = m.preferred ? '<span class="tag pref">偏好</span>' : "";
    var prefCheck = '<input type="checkbox" class="pref-check"' + (m.preferred ? " checked" : "") + ' data-pref="' + esc(m.id) + '" title="设为偏好模型">';
    var coolCell = m.cooling
      ? '<span class="cool-time' + (m.reason ? " over" : "") + '">' + esc(until(m.until)) + "</span>"
      : '<span class="dim">—</span>';
    var switchBtn = '<button class="ghost" data-switch="' + esc(m.id) + '" type="button" title="下次请求强制切换到该模型">切换</button>';
    var toggleBtn = m.disabled
      ? '<button class="ghost ok" data-enable="' + esc(m.id) + '" type="button">启用</button>'
      : '<button class="ghost danger" data-disable="' + esc(m.id) + '" type="button">禁用</button>';
    return '<div class="model-row' + (isActive ? " active" : "") + (m.disabled ? " disabled" : "") + '" data-model="' + esc(m.id) + '">' +
      '<div class="mr-status">' + tag + preferredTag + '<span class="tag free" title="Free Switch 仅托管免费模型">免费</span></div>' +
      '<div class="mr-model"><div class="id">' + esc(m.id) + "</div>" + name + err + "</div>" +
      '<div class="mr-cool" title="冷却剩余时间"><span class="dim">冷却</span> ' + coolCell + "</div>" +
      '<div class="mr-last" title="最近一次请求结果">' + last + ' <span class="dim mono">' + (m.lastSuccessAt ? clock(m.lastSuccessAt) : "—") + "</span></div>" +
      '<div class="mr-fail" title="连续失败次数">失败 ' + n(m.failures) + "</div>" +
      '<div class="mr-action"><label class="pref-label" title="勾选后优先使用该模型">' + prefCheck + '</label>' + switchBtn + '<button class="ghost" data-clear="' + esc(m.id) + '" type="button">清除</button>' + toggleBtn + "</div>" +
      "</div>";
  }
  function provIcon(provider) {
    var seed = 0;
    for (var i = 0; i < provider.length; i++) seed = (seed * 31 + provider.charCodeAt(i)) >>> 0;
    var emojis = ["🚀", "⚡", "🧠", "🔮", "🌟", "🔥", "💡", "⚡", "⚡", "⚡", "⚡", "⚡", "⚡", "⚡", "⚡", "⚡"];
    return emojis[seed % emojis.length];
  }
  function providerHealth(models, p) {
    var list = models.filter(function (m) { return (m.provider || "") === p; });
    var total = list.length;
    var awake = list.filter(function (m) { return !m.cooling; }).length;
    var status = total === 0 ? "down" : (awake === 0 ? "down" : (awake < total ? "degraded" : "healthy"));
    return { total: total, awake: awake, status: status, preferred: list.filter(function (m) { return m.preferred; }).length };
  }
  function effectiveProviders(models, includeProviders) {
    var freeSet = {};
    models.forEach(function (m) { if (m.provider) freeSet[m.provider] = true; });
    if (Array.isArray(includeProviders) && includeProviders.length) return includeProviders.slice();
    return Object.keys(freeSet);
  }
  function renderProviderDialogRows(allProviders, models, selectedSet, creditMap, disabledProviders) {
    var q = (provSearch || "").trim().toLowerCase();
    var parts = [];
    (allProviders || []).forEach(function (prov) {
      var p = prov.id || prov;
      var name = prov.name || p;
      if (q && (p + " " + name).toLowerCase().indexOf(q) < 0) return;
      var selected = !!selectedSet[p];
      var freeTag = providerHealth(models, p).total > 0
        ? '<span class="tag free">免费</span>'
        : '<span class="tag paid">付费</span>';
      var credit = creditMap[p];
      var hasCredits = credit && (credit.used !== undefined || credit.balance !== undefined);
      var creditText = "";
      if (hasCredits) {
        creditText = '<span class="chip-credit">积分 <b>' + (credit.used ?? 0) + "/" + (credit.total ?? 0) + "</b></span>";
      }
      var disabledMark = disabledProviders[p] ? '<span class="chip-credit">已禁用</span>' : "";
      var cls = ["dlg-item", selected ? "selected" : ""].filter(Boolean).join(" ");
      parts.push(
        '<label class="' + cls + '" data-prov="' + esc(p) + '">' +
          '<input type="checkbox" class="prov-chip-check"' + (selected ? " checked" : "") + ' data-prov-check="' + esc(p) + '">' +
          '<span class="chip-ic">' + provIcon(p) + "</span>" +
          '<span class="chip-name">' + esc(p) + "</span>" +
          freeTag +
          '<span class="chip-credit-wrap">' + creditText + disabledMark + "</span>" +
        "</label>"
      );
    });
    return parts.join("");
  }
  function renderSelectedProviders(selectedIds, models, creditMap, disabledProviders, paidCounts) {
    var parts = [];
    (selectedIds || []).slice().sort().forEach(function (p) {
      var h = providerHealth(models, p);
      var credit = creditMap[p];
      var hasCredits = credit && (credit.used !== undefined || credit.balance !== undefined);
      var sub = h.total
        ? h.awake + "/" + h.total + " 苏醒" + (h.preferred ? " · " + h.preferred + " 偏好" : "") + (paidCounts && paidCounts[p] ? " · " + paidCounts[p] + " 付费" : "")
        : (paidCounts && paidCounts[p] ? paidCounts[p] + " 个付费模型" : "无模型");
      var creditText = "";
      if (hasCredits) {
        var amt = credit.balance !== undefined ? " · 余额 " + credit.balance : "";
        creditText = '<span class="prov-credit">积分 <b>' + (credit.used ?? 0) + "/" + (credit.total ?? 0) + "</b>" + amt + "</span>";
      }
      var cls = ["prov-item", h.status, provFocus === p ? "selected" : "", hasCredits ? "has-credits" : "", disabledProviders[p] ? "disabled" : ""].filter(Boolean).join(" ");
      var freeTag = h.total > 0 ? '<span class="tag free">免费</span>' : '<span class="tag paid">付费</span>';
      var creditPart = hasCredits
        ? '<span class="prov-credit">积分 <b>' + (credit.used ?? 0) + "/" + (credit.total ?? 0) + "</b>" + (credit.balance !== undefined ? " · 余额 " + credit.balance : "") + "</span>"
        : "";
      parts.push(
        '<div class="' + cls + '" data-prov="' + esc(p) + '" data-prov-filter="' + esc(p) + '" title="点击筛选该供应商的模型，再点取消">' +
          '<div class="prov-top">' +
            '<div class="prov-ic">' + provIcon(p) + "</div>" +
            '<div class="prov-name">' + esc(p) + "</div>" +
            freeTag +
            '<div class="prov-actions">' +
              (disabledProviders[p]
                ? '<button class="ghost ok" data-enable-provider="' + esc(p) + '" type="button">启用</button>'
                : '<button class="ghost danger" data-disable-provider="' + esc(p) + '" type="button">禁用</button>') +
            "</div>" +
          "</div>" +
          '<div class="prov-sub">' +
            '<span class="prov-stat"><span class="dot"></span>' + esc(sub) + "</span>" +
            creditPart +
          "</div>" +
        "</div>"
      );
    });
    return parts.join("");
  }
  function modelTier(m, activeId) {
    if (m.id === activeId) return 0; // 正在使用
    if (m.paid) return 5; // 付费 · 只读展示
    if (m.disabled) return 4; // 已禁用
    if (m.cooling) return 3; // 冷却
    if (m.preferred) return 1; // 苏醒 · 偏好
    return 2; // 苏醒
  }
  function modelTree(models, activeId, sortMode) {
    var q = filter.trim().toLowerCase();
    var list = models.filter(function (m) {
      return !q || (m.id + " " + m.provider + " " + m.name).toLowerCase().indexOf(q) >= 0;
    });
    list.sort(function (a, b) {
      if (sortMode === "priority") {
        var ta = modelTier(a, activeId);
        var tb = modelTier(b, activeId);
        if (ta !== tb) return ta - tb;
        return compareModels(a, b, "wake");
      }
      return compareModels(a, b, sortMode);
    });
    return list.map(function (m) { return modelRow(m, activeId); }).join("");
  }
  function txt(id, value) {
    var el = document.getElementById(id);
    if (el) el.textContent = value == null ? "" : value;
  }
  function html(id, value) {
    var el = document.getElementById(id);
    if (el) el.innerHTML = value == null ? "" : value;
  }
  function hidden(id, isHidden) {
    var el = document.getElementById(id);
    if (el) el.hidden = !!isHidden;
  }
  function className(id, cls) {
    var el = document.getElementById(id);
    if (el) el.className = cls;
  }
  function render() {
    if (!state) return;
    var stats = state.stats || {};
    var models = state.models || [];
    var cooling = models.filter(function (m) { return m.cooling; }).length;
    var awake = models.length - cooling;
    var preferredCount = models.filter(function (m) { return m.preferred; }).length;
    txt("s-requests", n(stats.requests));
    txt("s-switches", n(stats.switches));
    txt("s-success", n(stats.successes));
    txt("s-rate", stats.requests ? Math.round((stats.successes / stats.requests) * 100) + "%" : "");
    txt("s-exhausted", n(stats.exhausted));
    txt("s-cooling", n(cooling));
    txt("s-awake", models.length ? "/ " + n(awake) + " 苏醒" : "");
    txt("model-count", models.length ? "· " + models.length + (preferredCount ? " · " + preferredCount + " 偏好" : "") : "");
    txt("gateway", state.gateway || "—");
    txt("version", state.version || "—");
    txt("config-path", state.configFile || "—");

    var cfg = state.config || {};
    var strategySelect = document.getElementById("strategy");
    if (strategySelect) strategySelect.value = cfg.strategy || "free";
    var paidPolicyEl = document.getElementById("paid-policy");
    if (paidPolicyEl) paidPolicyEl.hidden = (cfg.strategy || "free") === "free";
    var paidWindowEl = document.getElementById("paid-window");
    if (paidWindowEl && document.activeElement !== paidWindowEl) paidWindowEl.value = cfg.paidWindow || "";
    var paidBalanceEl = document.getElementById("paid-min-balance");
    if (paidBalanceEl && document.activeElement !== paidBalanceEl) paidBalanceEl.value = cfg.paidMinBalance ? String(cfg.paidMinBalance) : "";

    if (state.discoveryError) {
      className("health-dot", "dot bad");
      var healthText = document.getElementById("health-text");
      if (healthText) { healthText.textContent = "模型发现失败"; healthText.title = state.discoveryError; }
    } else {
      className("health-dot", "dot ok");
      var healthText = document.getElementById("health-text");
      if (healthText) {
        healthText.textContent = models.length ? "在线 · " + models.length + " 个免费模型" : "在线 · 未发现免费模型";
        healthText.title = "";
      }
    }

    // ---- 选择提供商（dialog）+ 已选列表（左栏）----
    var provDisabledObj = {};
    (Array.isArray(state.disabledProviders) ? state.disabledProviders : []).forEach(function (p) { provDisabledObj[p] = true; });
    var creditMap = {};
    (state.credits || []).forEach(function (c) { if (c && c.provider) creditMap[c.provider] = c; });
    var selProviders = effectiveProviders(models, state.config?.includeProviders);
    var selSet = {};
    selProviders.forEach(function (p) { selSet[p] = true; });
    var allProviders = state.allProviders || [];
    var dlgHTML = renderProviderDialogRows(allProviders, models, selSet, creditMap, provDisabledObj);
    html("dlg-prov-list", dlgHTML);
    hidden("dlg-prov-empty", !!dlgHTML);
    txt("prov-count", allProviders.length ? "· " + allProviders.length : "");

    if (provFocus && !selSet[provFocus]) provFocus = "";
    // 展示目录：免费模型带 failover 状态，付费模型只读展示（不参与自动切换）
    var freeMap = {};
    models.forEach(function (m) { freeMap[m.id] = m; });
    var catalog = state.catalog || [];
    var paidCounts = {};
    catalog.forEach(function (c) { if (!c.free) paidCounts[c.provider] = (paidCounts[c.provider] || 0) + 1; });
    var allRows = catalog.map(function (c) {
      var m = freeMap[c.id];
      return m || {
        id: c.id, provider: c.provider, name: c.name, paid: !c.free, paidBlocked: c.paidBlocked ?? null,
        cooling: false, until: 0, failures: 0, lastStatus: null, lastError: null,
        reason: null, disabled: false, lastSuccessAt: null,
        context: c.context, image: c.image, toolcall: c.toolcall, reasoning: c.reasoning,
      };
    });

    var selHTML = renderSelectedProviders(selProviders, models, creditMap, provDisabledObj, paidCounts);
    html("sel-prov-list", selHTML);
    hidden("sel-prov-empty", !!selHTML);
    txt("sel-count", selProviders.length ? "· " + selProviders.length : "");

    // 默认展示全部模型；点击左栏某供应商则只看它的，再点恢复
    var visibleModels = provFocus
      ? allRows.filter(function (m) { return (m.provider || "") === provFocus; })
      : allRows;
    txt("model-count", visibleModels.length
      ? "· " + visibleModels.length + (provFocus ? " · " + provFocus : "")
      : provFocus ? "· " + provFocus : "");
    var modelHTML = modelTree(visibleModels, state.activeModel ? state.activeModel.id : null, sortMode);
    html("models", modelHTML);
    hidden("models-empty", !!modelHTML);
    if (state.activeModel && state.activeModel.id) {
      hidden("active-bar", false);
      var parts = String(state.activeModel.id).split("/");
      txt("active-provider", parts.length > 1 ? parts[0] : "");
      txt("active-model", parts.length > 1 ? parts.slice(1).join("/") : state.activeModel.id);
      txt("active-at", clock(state.activeModel.at));
    } else {
      hidden("active-bar", true);
    }
  }
  function banner(message) {
    var el = document.getElementById("banner");
    if (!el) return;
    el.textContent = message || "";
    el.className = "banner" + (message ? " show" : "");
  }
  async function load() {
    if (loading) return;
    loading = true;
    try {
      var res = await fetch("/api/state", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      state = await res.json();
      banner("");
      render();
    } catch (e) {
      banner("控制台无法读取状态：" + (e && e.message ? e.message : e));
      className("health-dot", "dot bad");
      var healthText = document.getElementById("health-text");
      if (healthText) healthText.textContent = "连接失败";
    } finally {
      loading = false;
    }
  }
  async function action(path, body) {
    try {
      var res = await fetch(path, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body || {}),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      state = await res.json();
      banner("");
      render();
    } catch (e) {
      banner("操作失败：" + (e && e.message ? e.message : e));
    }
  }
  document.addEventListener("click", function (ev) {
    var t = ev.target;
    if (!t || !t.closest) return;
    var clear = t.closest("[data-clear]");
    if (clear) {
      ev.stopPropagation();
      action("/api/clear", { model: clear.getAttribute("data-clear") });
      return;
    }
    var dis = t.closest("[data-disable]");
    if (dis) {
      ev.stopPropagation();
      action("/api/disable", { model: dis.getAttribute("data-disable") });
      return;
    }
    var en = t.closest("[data-enable]");
    if (en) {
      ev.stopPropagation();
      action("/api/enable", { model: en.getAttribute("data-enable") });
      return;
    }
    var sw = t.closest("[data-switch]");
    if (sw) {
      ev.stopPropagation();
      var swModel = sw.getAttribute("data-switch");
      var swPaidRow = t.closest(".model-row.paid");
      if (swPaidRow) {
        if (!window.confirm("手动切换到付费模型 " + swModel + "：下次请求将强制使用该模型，可能产生实际费用。确定继续？")) return;
      }
      action("/api/switch", { model: swModel });
      return;
    }
    var disProv = t.closest("[data-disable-provider]");
    if (disProv) {
      ev.stopPropagation();
      action("/api/disable", { provider: disProv.getAttribute("data-disable-provider") });
      return;
    }
    var enProv = t.closest("[data-enable-provider]");
    if (enProv) {
      ev.stopPropagation();
      action("/api/enable", { provider: enProv.getAttribute("data-enable-provider") });
      return;
    }
    var provFilterClick = t.closest("[data-prov-filter]");
    if (provFilterClick) {
      var pf = provFilterClick.getAttribute("data-prov-filter");
      provFocus = provFocus === pf ? "" : pf;
      render();
      return;
    }
    var provCheck = t.closest("[data-prov-check]");
    if (provCheck) {
      var provId = provCheck.getAttribute("data-prov-check");
      // 当前生效集合：includeProviders 非空用它，否则为有免费模型的全部供应商（auto）
      var base = effectiveProviders(state.models || [], state.config?.includeProviders);
      var next;
      if (provCheck.checked) {
        var cur = state.config?.includeProviders;
        next = Array.isArray(cur) && cur.length ? cur.slice() : base.slice();
        if (next.indexOf(provId) < 0) next.push(provId);
      } else {
        next = base.filter(function (p) { return p !== provId; });
      }
      action("/api/providers", { providers: next });
      return;
    }
    var themeBtn = t.closest("#theme-toggle");
    if (themeBtn) {
      if (themeMode === "system") themeMode = "light";
      else if (themeMode === "light") themeMode = "dark";
      else themeMode = "system";
      saveTheme();
      applyTheme();
    }
  });
  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (!t || !t.closest) return;
    var pref = t.closest("[data-pref]");
    if (pref) {
      var modelId = pref.getAttribute("data-pref");
      action("/api/preferred", { model: modelId });
    }
  });
  var filterEl = document.getElementById("filter");
  if (filterEl) filterEl.addEventListener("input", function (ev) {
    filter = ev.target.value || "";
    render();
  });
  var sortEl = document.getElementById("sort");
  if (sortEl) sortEl.addEventListener("change", function (ev) {
    sortMode = ev.target.value || "priority";
    render();
  });
  // 一次性提交完整付费策略，避免只改一个字段时把其余字段写回默认值。
  function paidPolicy(patch) {
    var cfg = (state && state.config) || {};
    var payload = {
      strategy: cfg.strategy || "free",
      maxPaidTries: cfg.maxPaidTries,
      paidWindow: cfg.paidWindow || null,
      paidMinBalance: cfg.paidMinBalance || 0,
    };
    for (var k in patch) payload[k] = patch[k];
    return payload;
  }
  var strategyEl = document.getElementById("strategy");
  if (strategyEl) strategyEl.addEventListener("change", function (ev) {
    action("/api/strategy", paidPolicy({ strategy: ev.target.value }));
  });
  var paidWindowInput = document.getElementById("paid-window");
  if (paidWindowInput) paidWindowInput.addEventListener("change", function (ev) {
    action("/api/strategy", paidPolicy({ paidWindow: ev.target.value.trim() || null }));
  });
  var paidBalanceInput = document.getElementById("paid-min-balance");
  if (paidBalanceInput) paidBalanceInput.addEventListener("change", function (ev) {
    var v = Number(ev.target.value);
    action("/api/strategy", paidPolicy({ paidMinBalance: Number.isFinite(v) && v > 0 ? v : 0 }));
  });
  var provSearchEl = document.getElementById("prov-search");
  if (provSearchEl) provSearchEl.addEventListener("input", function (ev) {
    provSearch = ev.target.value || "";
    render();
  });
  // 选择提供商 dialog：顶栏按钮打开，关闭按钮/点击遮罩关闭
  var provDialog = document.getElementById("prov-dialog");
  var provPickerBtn = document.getElementById("prov-picker-btn");
  var provDialogClose = document.getElementById("prov-dialog-close");
  if (provPickerBtn && provDialog) provPickerBtn.addEventListener("click", function () { provDialog.showModal(); });
  if (provDialogClose && provDialog) provDialogClose.addEventListener("click", function () { provDialog.close(); });
  if (provDialog) provDialog.addEventListener("click", function (ev) {
    if (ev.target === provDialog) provDialog.close();
  });
  // 拖拽分隔条调整左右栏宽度
  (function setupSplitter() {
    var splitter = document.getElementById("splitter");
    var grid = document.getElementById("grid2");
    if (!splitter || !grid) return;
    var dragging = false;
    function onMove(ev) {
      if (!dragging) return;
      var rect = grid.getBoundingClientRect();
      var x = ev.clientX - rect.left;
      var pct = (x / rect.width) * 100;
      pct = Math.max(18, Math.min(72, pct));
      grid.style.setProperty("--prov-w", pct + "%");
    }
    function onUp() {
      dragging = false;
      splitter.classList.remove("dragging");
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
    }
    splitter.addEventListener("mousedown", function (ev) {
      dragging = true;
      splitter.classList.add("dragging");
      ev.preventDefault();
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
  })();
  var refreshEl = document.getElementById("refresh");
  if (refreshEl) refreshEl.addEventListener("click", function () { action("/api/refresh"); });
  var clearEl = document.getElementById("clear");
  if (clearEl) clearEl.addEventListener("click", function () {
    if (confirm("清空所有模型的冷却时间？")) action("/api/clear", {});
  });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) load();
  });
  load();
  setInterval(function () { if (!document.hidden) load(); }, 2000);
})();
</script>
</body>
</html>
